name: iCar
options:
  bundleIdPrefix: cn.icar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # 硬化：体积优化 + 去符号 + 裁死代码（发布包用）
    SWIFT_OPTIMIZATION_LEVEL: "-Osize"
    SWIFT_COMPILATION_MODE: wholemodule
    DEAD_CODE_STRIPPING: YES
    DEPLOYMENT_POSTPROCESSING: YES
    STRIP_INSTALLED_PRODUCT: YES
    STRIP_STYLE: all
    ENABLE_TESTABILITY: NO
    ENABLE_NS_ASSERTIONS: NO
    GCC_SYMBOLS_PRIVATE_EXTERN: YES
targets:
  iCar:
    type: application
    platform: iOS
    sources:
      - path: iCar
        excludes:
          - Info.plist
          - CarWeb
          - WebUI
      - path: iCar/CarWeb
        type: folder
        buildPhase: resources
      - path: iCar/WebUI
        type: folder
        buildPhase: resources
    info:
      path: iCar/Info.plist
      properties:
        CFBundleDisplayName: 岁岁长安
        CFBundleDevelopmentRegion: zh_CN
        # 版本号：和下面的 MARKETING_VERSION / CURRENT_PROJECT_VERSION 保持一致
        # （release-ios.sh 会一起改，别只改一处）
        CFBundleShortVersionString: "0.21"
        CFBundleVersion: "20"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSPhotoLibraryUsageDescription: 选一张照片当 App 的背景图
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.icar.native
        PRODUCT_NAME: iCar
        MARKETING_VERSION: "0.21"
        CURRENT_PROJECT_VERSION: "20"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
