name: iCar
options:
  bundleIdPrefix: cn.icar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  iCar:
    type: application
    platform: iOS
    sources:
      - path: iCar
        excludes:
          - Info.plist
          - CarWeb
      - path: iCar/CarWeb
        type: folder
        buildPhase: resources
    info:
      path: iCar/Info.plist
      properties:
        CFBundleDisplayName: 岁岁长安
        CFBundleDevelopmentRegion: zh_CN
        # 版本号：和下面的 MARKETING_VERSION / CURRENT_PROJECT_VERSION 保持一致
        # （release-ios.sh 会一起改，别只改一处）
        CFBundleShortVersionString: "0.10"
        CFBundleVersion: "9"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.icar.native
        PRODUCT_NAME: iCar
        MARKETING_VERSION: "0.10"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
