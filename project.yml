name: iCar
options:
  bundleIdPrefix: cn.icar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  iCar:
    type: application
    platform: iOS
    sources:
      - path: iCar
        excludes:
          - Info.plist
    info:
      path: iCar/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.icar.native
        PRODUCT_NAME: iCar
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
