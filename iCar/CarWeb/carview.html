<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; }
  #vehicle-3d { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="vehicle-3d"></canvas></div>
<script>
  // 从 URL 取车型文件，比如 carview.html?model=C211.glb
  var m = /[?&]model=([^&]+)/.exec(location.search);
  window.CAR_MODEL_FILE = '3D/' + (m ? decodeURIComponent(m[1]) : 'C211.glb');
  window.CAR_PAINT = '#FFFFFF';
  window.app = { apiData: {} };
  window.CarOverlay = { render: function () {} };
  window.playCabinIntro = function () {};
  window.setMore = function () {};

  // Swift 调这个来推车况
  window.setCarStatus = function (obj) {
    window.app.apiData = obj || {};
    try { if (window.vehicle3D) window.vehicle3D.updateBodyStatus(); } catch (e) {}
  };
</script>
<script src="js/three/three.min.js"></script>
<script src="js/three/meshopt_decoder.js"></script>
<script src="js/three/GLTFLoader.js"></script>
<script src="js/three/OrbitControls.js"></script>
<script src="js/three/RGBELoader.js"></script>
<script src="js/viewer3d.js"></script>
</body>
</html>
