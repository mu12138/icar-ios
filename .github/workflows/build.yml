name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild -project iCar.xcodeproj \
            -scheme iCar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iCar.app Payload/
          zip -qr iCar-unsigned.ipa Payload
          ls -lh iCar-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: iCar-unsigned-ipa
          path: iCar-unsigned.ipa
